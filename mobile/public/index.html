<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FECNA Agent</title>
    <meta name="theme-color" content="#023E8A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FECNA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      /* PWA a pantalla completa en iPhone: la app ocupa toda la pantalla (position: fixed) y se
         reservan las zonas seguras con env(). El fondo va en <html> (azul arriba, blanco abajo)
         y el body es transparente, para que las franjas seguras no queden del color de la app. */
      html { height: 100%; background: linear-gradient(#023E8A 50%, #FFFFFF 50%); }
      body {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; margin: 0; overflow: hidden;
        box-sizing: border-box; background: transparent;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #root { display: flex; height: 100%; flex: 1; background: #F5FAFF; }
    </style>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta app.</noscript>
    <div id="root"></div>
  </body>
</html>
