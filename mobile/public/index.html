<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FECNA Agent</title>
    <meta name="theme-color" content="#023E8A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FECNA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      /* El iPhone (PWA a pantalla completa) reserva zonas seguras: arriba la barra de estado y
         abajo el indicador de inicio. Se respetan con env(); el fondo de cada franja casa con
         lo que hay al lado (azul del encabezado arriba, blanco de la barra de pestañas abajo). */
      html { height: 100%; background: linear-gradient(#023E8A 50%, #FFFFFF 50%); }
      body {
        height: 100%; margin: 0; overflow: hidden; box-sizing: border-box; background: #F5FAFF;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta app.</noscript>
    <div id="root"></div>
  </body>
</html>
