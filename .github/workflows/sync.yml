name: Sincronizar ranking FECNA

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "incremental = solo novedades; completa = desde 2024-01-01 (lento)"
        type: choice
        options: [incremental, completa]
        default: incremental
  schedule:
    - cron: "0 9 * * 1"   # lunes 04:00 hora Colombia

concurrency:
  group: fecna-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests "psycopg[binary]>=3.2"
      - name: Sincronizar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODO: ${{ inputs.modo }}
        run: |
          # La ejecución programada no trae input: siempre es incremental.
          if [ "${MODO:-incremental}" = "completa" ]; then
            python -m fecna_agent sync --inicio 2024-01-01
          else
            python -m fecna_agent sync --incremental
          fi
