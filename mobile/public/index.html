<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FECNA Agent</title>
    <meta name="theme-color" content="#023E8A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FECNA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      /* PWA a pantalla completa en iPhone: la app ocupa toda la pantalla (position: fixed) y se
         reservan las zonas seguras con env(). El fondo va en <html> (azul arriba, blanco abajo)
         y el body es transparente, para que las franjas seguras no queden del color de la app. */
      html { height: 100%; background: linear-gradient(#023E8A 50%, #FFFFFF 50%); }
      body {
        position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; margin: 0; overflow: hidden;
        box-sizing: border-box; background: transparent;
        padding-top: env(safe-area-inset-top);
      }
      /* iOS amplía la página al enfocar un campo con letra menor de 16 px: se evita sin bloquear el zoom. */
      input, textarea { font-size: 16px !important; }
      #root { display: flex; height: 100%; flex: 1; background: #F5FAFF; }
    </style>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta app.</noscript>
    <div id="root"></div>
    <script>
      /* En iOS (modo instalado) innerHeight excluye la zona segura superior (894 frente a 956 de
         pantalla): se usa la altura real de la pantalla en vertical para que la barra inferior
         llegue al borde. */
      (function () {
        function fit() {
          var portrait = window.innerWidth < window.innerHeight + 200 && window.innerHeight > window.innerWidth;
          var standalone = window.navigator.standalone === true;
          var h = window.innerHeight;
          if (standalone && portrait) h = Math.max(h, window.screen.height);
          document.body.style.height = h + 'px';
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
      })();
    </script>
  </body>
</html>
