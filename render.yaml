# Blueprint de Render: crea el servicio de la API con "New → Blueprint".
# Los valores con sync: false se piden en el panel (nunca se guardan en el repo).
services:
  - type: web
    name: natia-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon          # misma región que Supabase (us-west-2)
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL            # cadena del Session pooler de Supabase
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FECNA_JWT_SECRET        # cadena aleatoria larga; generar con: openssl rand -hex 32
        sync: false
      - key: FECNA_ADMIN_EMAIL       # correo(s) con rol admin
        sync: false
      - key: GITHUB_TOKEN            # fine-grained, permiso Actions: read/write
        sync: false
      - key: GITHUB_REPO
        value: leyeguemen/fecna-agent
      - key: GITHUB_REF
        value: main
      - key: FECNA_ASK_DAILY_LIMIT
        value: "50"

  # Versión web instalable (PWA) de la app, para iPhone sin cuenta de Apple Developer.
  - type: web
    name: natia-app
    runtime: static
    branch: main
    buildCommand: cd mobile && npm ci && npx expo export -p web
    staticPublishPath: ./mobile/dist
    autoDeploy: true
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://natia-api.onrender.com
      - key: NODE_VERSION
        value: 20.20.2
    routes:
      - type: rewrite        # landing estática (mobile/public/bienvenida), antes de la regla de la app
        source: /bienvenida
        destination: /bienvenida/index.html
      - type: rewrite        # navegación del lado del cliente (expo-router)
        source: /*
        destination: /index.html
    # Cabeceras de seguridad (Render ya pone HSTS y nosniff). Sin CSP por ahora: hay que probarla
    # en el navegador antes, porque Expo web puede necesitar scripts y estilos en línea.
    headers:
      - path: /*
        name: X-Frame-Options          # nadie puede incrustar la app en un iframe (clickjacking)
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy       # la app no usa cámara, micrófono ni ubicación del navegador
        value: camera=(), microphone=(), geolocation=()
